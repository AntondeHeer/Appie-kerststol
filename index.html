// Teken de originele, goedgekeurde personages zonder ze opnieuw te maken.
function person(name,a,b,w,h){const im=sprites[name];if(im&&im.complete&&im.naturalWidth)x.drawImage(im,a,b,w,h)}
// Kleine sfeerdetails bovenop de bestaande achtergrond, zonder het originele decor te vervangen.
function atmosphere(){
  // Warm schijnsel uit de etalage.
  const glow=x.createRadialGradient(585,280,8,585,280,185);
  glow.addColorStop(0,'rgba(255,190,83,.13)');glow.addColorStop(1,'rgba(255,190,83,0)');
  x.fillStyle=glow;x.fillRect(380,85,410,340);
  // Besneeuwde straat glinstert subtiel.
  for(let i=0;i<13;i++){let xx=36+i*72, yy=471+(i%3)*13;rect(xx,yy,8,2,'rgba(225,237,248,.30)')}
}
// Subtiele etalage-animatie: originele figuren blijven onderdeel van het decor.
// Alleen de pixels rond hun bovenlichaam verschuiven maximaal 1 pixel.
let frameClock=0;
// De bestaande figuren in de etalage worden uit de originele achtergrond geknipt.
// De onbewerkte achtergrond blijft behouden; de beweging is een levendige illusie.
function shopLife(){
 frameClock++;
 // De figuren zitten nog in de achtergrond. Geen nep-armen over de toonbank.
 // Alleen subtiel warm licht; de etalage en producten blijven stil.
 const t=frameClock/60;
 x.save();
 x.fillStyle=`rgba(255,190,105,${.008+.006*Math.sin(t*1.3)})`;
 x.fillRect(463,158,218,195);
 x.restore();
}

function draw(){
if(backdrop.complete&&backdrop.naturalWidth)x.drawImage(backdrop,0,0,960,540);
else rect(0,0,960,540,'#182444');
// De bakkerij en de etalage blijven onbeweeglijk.

// Approved character sprites remain unchanged; overlay the moving pair.
// Appie is groter en beweegt tijdens het lopen; Bikkel huppelt mee.
const walking=Math.abs(px-tx)>1;
const gait=walking?Math.sin(frameClock*.24):0;
const appieW=69,appieH=128;
const dogIdle=0;
person('bikkel',px-76,417+dogIdle,72,64);
// Af en toe een kwispelende staart en een klein snuffelbewegingetje.

const idle=0;
person('appie',px-34,450-appieH+idle,appieW,appieH);
for(const s of snow){circle(s[0],s[1],s[2]*.6,'#f0f4ff');s[1]+=s[2]*.22;if(s[1]>540){s[1]=0;s[0]=Math.random()*960}}
if(Math.abs(px-tx)>1)px+=(tx-px)*.08;requestAnimationFrame(draw)}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),a=(e.clientX-r.left)*960/r.width,b=(e.clientY-r.top)*540/r.height;if(b>375){tx=Math.max(80,Math.min(860,a));say.textContent='Appie loopt verder. Bikkel volgt hem op de voet.'}else if(a>400&&a<770){look()}else if(a<135){goMarket()}});
function look(){const lines=['Appie: “Psst, Bikkel! Daar is Sophia!”','Bakker Anton: “De zaken gaan slecht... en Kerstmis komt eraan.”','Patricia: “Kunnen we niet iets bijzonders bakken voor Kerstmis?”','Bakker Anton: “Ik heb alleen meel en gist. Geen boter, geen vruchten... niets bijzonders.”','Appie: “Ik weet het! Op de markt en in de haven ligt genoeg lekkers. Ik ga Sophia helpen!”'];say.textContent=lines[Math.min(step,4)];step=Math.min(step+1,5)}function talk(){say.textContent='Appie: “Wat denk jij, Bikkel?”  Bikkel: “Woef!”  Appie: “Precies. Eerst naar de markt!”'}function goMarket(){if(step<4){say.textContent='Appie: “Eerst maar eens horen wat er in de bakkerij aan de hand is.”';return}say.textContent='🎉 Einde van de eerste proefscène! Volgende halte: de botermarkt. Die bouwen we hierna.';tx=80}draw();
</script></body></html>
